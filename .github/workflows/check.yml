name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=30m
      - name: Go build
        run: go build ./cmd/tapemgr
      - name: Go test
        run: go test ./...
